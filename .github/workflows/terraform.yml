name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

# Least-privilege: fmt/validate only need read; plan comments need PR write.
permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_CLI_ARGS: "-no-color"

jobs:
  # ── 1. Format check ─────────────────────────────────────────────────────────
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4

      - name: Check formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

  # ── 2. Validate ─────────────────────────────────────────────────────────────
  # Init connects to TFC (cloud backend) to download providers and validate the
  # configuration against the remote workspace. Requires TF_API_TOKEN.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ── 3. Speculative Plan (PRs only) ──────────────────────────────────────────
  # Runs a TFC speculative plan — read-only, never applied, returns the full
  # plan diff. Output is posted (or updated) as a PR comment.
  #
  # On push to main, TFC's VCS integration triggers the real plan + apply
  # automatically via the repository webhook. This job only runs on PRs.
  plan:
    name: Speculative Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          # terraform_wrapper captures stdout/stderr as step outputs
          terraform_wrapper: true

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform
        run: terraform plan
        continue-on-error: true

      - name: Post or update PR comment
        uses: actions/github-script@v9
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
          PLAN_STDERR: ${{ steps.plan.outputs.stderr }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const maxLen = 60000;
            const stdout = process.env.PLAN_STDOUT || "";
            const stderr = process.env.PLAN_STDERR || "";
            const outcome = process.env.PLAN_OUTCOME;
            const icon = outcome === "success" ? "✅" : "❌";

            let planText = stdout || stderr || "(no output)";
            if (planText.length > maxLen) {
              planText = planText.slice(0, maxLen) + "\n\n…output truncated…";
            }

            const marker = "<!-- tfc-speculative-plan -->";
            const body = [
              marker,
              `#### Terraform Speculative Plan ${icon} \`${outcome}\``,
              "",
              "> This is a read-only plan run in Terraform Cloud. It will not be applied.",
              "> On merge, TFC's VCS integration triggers the real plan + apply.",
              "",
              "<details><summary>Show plan output</summary>",
              "",
              "```",
              planText,
              "```",
              "",
              "</details>",
              "",
              `*Triggered by @${context.actor} · \`${context.eventName}\` · ${context.sha.slice(0, 7)}*`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(
              (c) => c.user.type === "Bot" && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
