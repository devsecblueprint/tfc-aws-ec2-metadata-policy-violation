name: Rego Policy Tests

on:
  push:
    branches: [main]
    paths:
      - "policies/**"
      - ".github/workflows/rego-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "policies/**"
      - ".github/workflows/rego-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: OPA Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install OPA
        run: |
          curl -sSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      - name: Run Rego unit tests
        run: opa test policies/ --verbose

      - name: Check policy syntax
        run: opa check policies/ --strict
